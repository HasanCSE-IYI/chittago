dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        def localMvn = new File('/root/maven/localMvnRepository')
        if (localMvn.exists()) {
            maven { url = uri(localMvn) }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = "chittago"
include ':app'
